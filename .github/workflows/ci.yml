name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install build and lint dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libpipewire-0.3-dev jq shellcheck qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest
      - name: Validate manifest structure
        run: |
          jq -e '
            .schemaVersion == 1 and
            (.id | test("^[a-z0-9]+([._-][a-z0-9]+)*$")) and
            (.kinds | index("service")) and
            (.kinds | index("bar-widget")) and
            (.entryPoints.service | type == "string") and
            (.entryPoints.barWidget | type == "string")
          ' manifest.json
          test -f "$(jq -r .entryPoints.service manifest.json)"
          test -f "$(jq -r .entryPoints.barWidget manifest.json)"
      - name: Check shell scripts
        run: shellcheck install.sh scripts/mic-effects-hide
      - name: Test QML text safety
        run: |
          if grep -nE '(^|[[:space:]])Text[[:space:]]*\{' plugin/Panel.qml; then
            echo "Panel text must use SafeText" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests -import plugin -o -,txt
      - name: Build daemon
        run: |
          make -C daemon clean
          make -C daemon all -j2
